[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sukuma-toolkit"
version = "0.1.0"
description = "Text and speech utilities for the Sukuma language (Bantu, northern Tanzania)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Hesron Kija" }]
keywords = ["sukuma", "nlp", "asr", "bantu", "low-resource"]
dependencies = [
    "datasets>=2.14",
    "pandas>=2.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
audio = ["librosa>=0.10", "soundfile>=0.12"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

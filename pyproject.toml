[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sukuma-toolkit"
description = "Text and speech utilities for the Sukuma language (Bantu, northern Tanzania)"
readme = "README.md"
dynamic = ["version"]
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Hesron Kija" }]
keywords = ["sukuma", "nlp", "asr", "bantu", "low-resource"]
# The package itself (normalize, restore, stats, score, the CLI) is standard library only.
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Linguistic",
]

[project.urls]
Repository = "https://github.com/hesronkija/sukuma-toolkit"
Issues = "https://github.com/hesronkija/sukuma-toolkit/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0"]
# data: what scripts/fetch_data.py and the Hub loaders need
data = ["datasets>=2.14", "huggingface_hub>=0.20", "pyarrow"]
audio = ["datasets>=2.14", "librosa>=0.10", "soundfile>=0.12"]
tokenizer = ["sentencepiece>=0.2"]
eda = ["matplotlib>=3.7"]
# omnilingual-asr needs Python 3.10-3.12 (no 3.13 wheels for fairseq2n) and torch 2.8.0 exactly. It also
# pins NumPy 1.x, and pyarrow 22+ needs NumPy 2, so pyarrow stays at 20-21. torchaudio must match torch,
# or it fails to load CUDA libraries. On a CPU-only Linux box, fairseq2 also needs its CPU variant.
omnilingual = ["omnilingual-asr>=0.2", "torch==2.8.0", "torchaudio==2.8.0", "pyarrow>=20,<22",
               "soundfile>=0.12", "scipy", "huggingface_hub>=0.20"]
audit = ["fasttext-numpy2-wheel", "huggingface_hub>=0.20"]
tokentax = ["transformers>=4.45,<5", "sentencepiece>=0.2", "matplotlib>=3.7"]
translate = ["torch", "transformers>=4.45,<5", "sentencepiece>=0.2", "sacrebleu>=2.4", "accelerate",
             "africa-bitext-builder>=0.1.13", "huggingface_hub>=0.20"]
whisper = ["transformers>=4.45,<5", "accelerate", "soundfile>=0.12", "scipy", "pyarrow", "huggingface_hub>=0.20"]

[project.scripts]
sukuma = "sukuma_toolkit.cli:main"

[tool.setuptools.dynamic]
version = { attr = "sukuma_toolkit.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sukuma_toolkit = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
